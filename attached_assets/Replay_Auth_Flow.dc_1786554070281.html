<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0B0F1A;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#F3F6FA;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,input{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
@keyframes rpEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rpDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,3%)}}
</style>
</helmet>
<div dir="ltr" style="min-height:100vh;background:#0B0F1A;display:flex;justify-content:center;font-family:Inter,sans-serif">
<div style="width:100%;max-width:440px;min-height:100vh;position:relative;overflow:hidden;background:#0B0F1A">

<div style="position:absolute;inset:-10%;z-index:0;background:radial-gradient(60% 45% at 15% 10%, rgba(47,216,196,.22), transparent 60%),radial-gradient(55% 50% at 90% 20%, rgba(123,92,255,.2), transparent 60%),radial-gradient(65% 55% at 25% 95%, rgba(212,255,79,.09), transparent 60%),radial-gradient(70% 60% at 100% 100%, rgba(47,216,196,.12), transparent 60%),linear-gradient(160deg,#0B0F1A,#0D1220 45%,#0B0F1A);animation:rpDrift 18s ease-in-out infinite"></div>
<div style="position:absolute;inset:0;z-index:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(60% 60% at 50% 30%,#000,transparent)"></div>

<div style="position:relative;z-index:10;display:flex;justify-content:center;padding:20px 14px 0">
<div style="width:26px;height:24px">
<svg viewBox="-5 0 225 200" width="100%" height="100%">
<defs><clipPath id="rpHeadBall"><circle cx="95" cy="96" r="88"></circle></clipPath></defs>
<g clip-path="url(#rpHeadBall)">
<polygon points="95,60 126.2,78 126.2,114 95,132 63.8,114 63.8,78" fill="#22C7B5"></polygon>
<polygon points="126.2,6 157.4,24 157.4,60 126.2,78 95,60 95,24" fill="#BFFF5C"></polygon>
<polygon points="63.8,6 95,24 95,60 63.8,78 32.6,60 32.6,24" fill="#3FE0C9"></polygon>
<polygon points="157.4,60 188.6,78 188.6,114 157.4,132 126.2,114 126.2,78" fill="#1FA79B"></polygon>
<polygon points="32.6,60 63.8,78 63.8,114 32.6,132 1.4,114 1.4,78" fill="#186E7E"></polygon>
<polygon points="126.2,114 157.4,132 157.4,168 126.2,186 95,168 95,132" fill="#1C8AA0"></polygon>
<polygon points="63.8,114 95,132 95,168 63.8,186 32.6,168 32.6,132" fill="#6C4FE0"></polygon>
</g>
<polygon points="170,62 170,134 210,98" fill="#0B0F1A"></polygon>
<polygon points="172,68 172,128 206,98" fill="#D4FF4F"></polygon>
<circle cx="178" cy="46" r="7.5" fill="#0B0F1A"></circle>
<circle cx="178" cy="46" r="5.5" fill="#FF5A3C"></circle>
</svg>
</div>
</div>

<sc-if value="{{ isAuthScreen }}" hint-placeholder-val="{{ true }}">
<div dir="rtl" style="position:relative;z-index:5;min-height:calc(100vh - 46px);display:flex;flex-direction:column;justify-content:center;padding:24px;font-family:'Tajawal','Cairo',sans-serif">
<div style="animation:rpEnter .45s ease both;padding:30px 24px 26px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),#141B2C;border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 70px rgba(0,0,0,.45)">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
<button onClick="{{ back }}" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#F3F6FA;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-7 6.5 7 6.5"></path></svg>
</button>
<button onClick="{{ next }}" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#F3F6FA;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="m14.5 5.5-7 6.5 7 6.5"></path></svg>
</button>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px">
<div style="width:52px;height:48px">
<svg viewBox="-5 0 225 200" width="100%" height="100%">
<defs><clipPath id="rpAuthBall"><circle cx="95" cy="96" r="88"></circle></clipPath></defs>
<g clip-path="url(#rpAuthBall)">
<polygon points="95,60 126.2,78 126.2,114 95,132 63.8,114 63.8,78" fill="#22C7B5"></polygon>
<polygon points="126.2,6 157.4,24 157.4,60 126.2,78 95,60 95,24" fill="#BFFF5C"></polygon>
<polygon points="63.8,6 95,24 95,60 63.8,78 32.6,60 32.6,24" fill="#3FE0C9"></polygon>
<polygon points="157.4,60 188.6,78 188.6,114 157.4,132 126.2,114 126.2,78" fill="#1FA79B"></polygon>
<polygon points="32.6,60 63.8,78 63.8,114 32.6,132 1.4,114 1.4,78" fill="#186E7E"></polygon>
<polygon points="126.2,114 157.4,132 157.4,168 126.2,186 95,168 95,132" fill="#1C8AA0"></polygon>
<polygon points="63.8,114 95,132 95,168 63.8,186 32.6,168 32.6,132" fill="#6C4FE0"></polygon>
</g>
<polygon points="170,62 170,134 210,98" fill="#0B0F1A"></polygon>
<polygon points="172,68 172,128 206,98" fill="#D4FF4F"></polygon>
<circle cx="178" cy="46" r="7.5" fill="#0B0F1A"></circle>
<circle cx="178" cy="46" r="5.5" fill="#FF5A3C"></circle>
</svg>
</div>
<div style="text-align:center">
<h1 style="margin:0;font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;letter-spacing:0">{{ t.title }}</h1>
<p style="margin:8px 0 0;font-size:13px;font-weight:600;color:rgba(243,246,250,.55)">{{ t.subtitlePrefix }} <span style="background-image:linear-gradient(90deg,#2FD8C4,#7B5CFF);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Rajdhani,sans-serif;font-weight:700">Replay</span></p>
</div>
</div>

<sc-if value="{{ isVerify }}" hint-placeholder-val="{{ false }}">
<div style="text-align:center;margin-bottom:22px">
<div style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:20px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2FD8C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4V5Zm0 1 8 6 8-6"></path></svg>
<span style="font-size:13px;font-weight:700;color:#F3F6FA">moebaid04@gmail.com</span>
</div>
<div dir="ltr" style="display:flex;justify-content:center;gap:8px">
<sc-for list="{{ otpDigits }}" as="d" hint-placeholder-count="6">
<input value="{{ d.value }}" onChange="{{ d.onChange }}" maxlength="1" inputmode="numeric" style="width:42px;height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);backdrop-filter:blur(6px);color:#F3F6FA;font-size:19px;font-weight:700;text-align:center;font-family:'Rajdhani',sans-serif" style-focus="border-color:#2FD8C4;background:rgba(47,216,196,.08)" />
</sc-for>
</div>
<p style="margin:16px 0 0;font-size:12.5px;font-weight:600;color:rgba(243,246,250,.45)">{{ t.resendPrefix }} <span style="color:#D4FF4F">{{ t.resendCount }}</span></p>
</div>
</sc-if>

<sc-if value="{{ hasGoogle }}" hint-placeholder-val="{{ false }}">
<div>
<button style="display:flex;width:100%;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#F3F6FA;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif" style-hover="background:rgba(255,255,255,.09)">
<svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.55c2.08-1.92 3.33-4.74 3.33-8.1Z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.55-2.77c-.99.66-2.26 1.06-3.73 1.06-2.87 0-5.3-1.94-6.16-4.55H2.18v2.86A10.99 10.99 0 0 0 12 23Z"></path><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.09V7.05H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.95l3.66-2.86Z"></path><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a10.99 10.99 0 0 0-9.82 6.05l3.66 2.86C6.7 7.3 9.13 5.38 12 5.38Z"></path></svg>
{{ t.google }}
</button>
<div style="display:flex;align-items:center;gap:10px;margin:18px 0">
<span style="height:1px;flex:1;background:rgba(255,255,255,.1)"></span>
<span style="font-size:11.5px;font-weight:600;color:rgba(243,246,250,.4)">{{ t.or }}</span>
<span style="height:1px;flex:1;background:rgba(255,255,255,.1)"></span>
</div>
</div>
</sc-if>

<div style="display:flex;flex-direction:column;gap:14px">
<sc-if value="{{ isSignin }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label style="font-size:12.5px;font-weight:700;color:rgba(243,246,250,.7)">{{ t.emailLabel }}</label>
<a href="#" style="font-size:12px;font-weight:700;color:#2FD8C4">{{ t.useOther }}</a>
</div>
</sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<label style="font-size:12.5px;font-weight:700;color:rgba(243,246,250,.7)">{{ t.emailLabel }}</label>
</sc-if>
<sc-if value="{{ showEmailField }}" hint-placeholder-val="{{ true }}">
<input placeholder="{{ t.emailPlaceholder }}" style="width:100%;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#F3F6FA;font-size:13.5px;font-weight:500;text-align:right;font-family:'Tajawal',sans-serif" />
</sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<div>
<label style="font-size:12.5px;font-weight:700;color:rgba(243,246,250,.7)">{{ t.passwordLabel }}</label>
<div style="position:relative;margin-top:8px">
<input type="password" placeholder="{{ t.passwordPlaceholder }}" style="width:100%;padding:14px 42px 14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#F3F6FA;font-size:13.5px;font-weight:500;text-align:right;font-family:'Tajawal',sans-serif" />
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(243,246,250,.5)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%)"><path d="M2.5 12S6 6.2 12 6.2 21.5 12 21.5 12 18 17.8 12 17.8 2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.4"></circle></svg>
</div>
</div>
</sc-if>
</div>

<button onClick="{{ t.continueAction }}" style="width:100%;margin-top:22px;padding:16px;border-radius:14px;border:0;background:#D4FF4F;color:#0B0F1A;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Tajawal',sans-serif" style-active="transform:scale(.97)">
{{ t.continue }}
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B0F1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6.5 6 6.5 6"></path></svg>
</button>

<p style="margin:18px 0 0;text-align:center;font-size:12.5px;font-weight:600;color:rgba(243,246,250,.5)">
{{ t.switchPrompt }} <a href="#" onClick="{{ t.switchAction }}" style="color:#D4FF4F;font-weight:800">{{ t.switchLink }}</a>
</p>
</div>
</div>
</sc-if>

<sc-if value="{{ isProfile }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;z-index:5;min-height:calc(100vh - 46px);padding:26px 22px 34px;font-family:Inter,sans-serif;animation:rpEnter .45s ease both">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
<button onClick="{{ back }}" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#F3F6FA;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-7 6.5 7 6.5"></path></svg>
</button>
<button onClick="{{ next }}" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#F3F6FA;cursor:pointer" style-hover="background:rgba(255,255,255,.08)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 7 6.5-7 6.5"></path></svg>
</button>
</div>
<h1 style="margin:0;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;letter-spacing:-.015em">Complete your profile</h1>
<p style="margin:8px 0 28px;font-size:13.5px;font-weight:500;color:#2FD8C4">Help us personalize your Replay experience.</p>

<div style="display:flex;flex-direction:column;gap:18px">
<sc-for list="{{ profileFields }}" as="pf" hint-placeholder-count="5">
<div>
<label style="font-size:12px;font-weight:700;color:rgba(243,246,250,.6)">{{ pf.label }}</label>
<div style="margin-top:8px;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(243,246,250,.4);font-size:13.5px;font-weight:500">{{ pf.placeholder }}</div>
</div>
</sc-for>
</div>

<button disabled style="width:100%;margin-top:34px;padding:16px;border-radius:14px;border:0;background:rgba(212,255,79,.28);color:rgba(11,15,26,.55);font-size:14.5px;font-weight:800;cursor:not-allowed;font-family:Inter,sans-serif">Continue</button>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:920}}">
class Component extends DCLogic {
  state = { step: 'signup', otp: ['', '', '', '', '', ''] };
  backMap = { signin: null, signup: null, verify: 'signup', profile: 'verify' };
  continueMap = { signin: 'profile', signup: 'verify', verify: 'profile', profile: 'profile' };
  order = ['signin', 'signup', 'verify', 'profile'];
  nextMap = { signin: 'signup', signup: 'verify', verify: 'profile', profile: 'signin' };
  prevMap = { signin: 'profile', signup: 'signin', verify: 'signup', profile: 'verify' };

  copyMap = {
    signin: { title: 'تسجيل الدخول', subtitlePrefix: 'للمتابعة إلى', google: 'المتابعة مع Google', or: 'أو',
      emailLabel: 'العنوان الإلكتروني', emailPlaceholder: 'Enter your email address', useOther: 'آخر للاستخدام',
      continue: 'متابعة', switchPrompt: 'ليس لديك حساب؟', switchLink: 'إنشاء حساب جديد' },
    signup: { title: 'إنشاء حساب جديد', subtitlePrefix: 'للمتابعة إلى', google: 'المتابعة مع Google', or: 'أو',
      emailLabel: 'العنوان الإلكتروني', emailPlaceholder: 'Enter your email address',
      passwordLabel: 'كلمة المرور', passwordPlaceholder: 'Create a password',
      continue: 'متابعة', switchPrompt: 'لديك حساب بالفعل؟', switchLink: 'تسجيل الدخول' },
    verify: { title: 'تحقق من بريدك الإلكتروني', subtitlePrefix: 'للمتابعة إلى',
      resendPrefix: 'لم يصلك الرمز؟ حاول مرة أخرى', resendCount: '(25)',
      continue: 'متابعة', switchPrompt: '', switchLink: '' }
  };

  fields = [
    { label: 'Full name', placeholder: 'Your full name' },
    { label: 'Phone number', placeholder: '+1 555 000 0000' },
    { label: 'Preferred position', placeholder: 'Select position' },
    { label: 'Age', placeholder: '25' },
    { label: 'Gender', placeholder: 'Select gender' }
  ];

  goTo(step) { return () => this.setState({ step }); }
  setOtp(i) { return (e) => { const v = e.target.value.replace(/\D/g, '').slice(-1); const otp = [...this.state.otp]; otp[i] = v; this.setState({ otp }); }; }

  renderVals() {
    const step = this.state.step;
    const t = this.copyMap[step] || this.copyMap.signup;
    const labels = { signin: 'Sign In', signup: 'Create Account', verify: 'Verify Email', profile: 'Complete Profile' };
    return {
      tabs: Object.keys(labels).map(k => ({
        label: labels[k], go: this.goTo(k),
        bg: step === k ? '#D4FF4F' : 'rgba(255,255,255,.05)',
        fg: step === k ? '#0B0F1A' : 'rgba(243,246,250,.6)',
        bd: step === k ? 'transparent' : 'rgba(255,255,255,.1)'
      })),
      isAuthScreen: step === 'signin' || step === 'signup' || step === 'verify',
      isProfile: step === 'profile',
      isSignin: step === 'signin', isSignup: step === 'signup', isVerify: step === 'verify',
      hasGoogle: step === 'signin' || step === 'signup',
      showEmailField: step === 'signin' || step === 'signup',
      t: { ...t, switchAction: this.goTo(step === 'signin' ? 'signup' : 'signin'), continueAction: this.goTo(this.continueMap[step]) },
      profileFields: this.fields,
      showBack: !!this.backMap[step], back: this.goTo(this.prevMap[step]), next: this.goTo(this.nextMap[step]),
      otpDigits: this.state.otp.map((v, i) => ({ value: v, onChange: this.setOtp(i) }))
    };
  }
}
</script>
</body>
</html>
