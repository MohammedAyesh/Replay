<title>Replay · My Clips · قصّيتها cards · Switch row (reference)</title>
<!--
  REFERENCE ONLY for the "قصّيتها" (Created) tab of My Clips: the clip card list.
  The header, the "مقاطعي" title, the three tabs and the bottom nav are NOT part of this
  reference and must not change. Colours are Replay's existing tokens:
    void #0B0F1A  surface #141B2C  raised #1B2338  line #232C42
    text #F2F4F8  muted #8A93A6  violet #7B5CFF  turf #2FD8C4
  Fonts: Cairo (Arabic headings), Tajawal (Arabic body), Rajdhani (numbers/times).
  English is the same layout mirrored (LTR).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@500;700&family=Rajdhani:wght@600;700&display=swap">
<style>
  body { margin: 0; background: #0B0F1A; color: #F2F4F8; font-family: 'Tajawal', system-ui, sans-serif; }
  .list { width: 358px; margin: 20px auto 40px; display: flex; flex-direction: column; gap: 12px; }

  /* card: the whole card plays the clip, exactly as today */
  .clip { border: 1px solid #232C42; border-radius: 16px; background: #141B2C; overflow: hidden; cursor: pointer; }
  .clip-top { display: flex; align-items: center; gap: 14px; padding: 12px; }

  /* thumbnail 132x84, 12px radius; everything inside is centred */
  .thumb { position: relative; flex: none; width: 132px; height: 84px; border-radius: 12px; overflow: hidden; background: #1B2338; }
  .thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-empty { position: absolute; inset: 0; background: #1B2338; display: flex; align-items: center; justify-content: center; }
  .thumb-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(123,92,255,0.25); }
  .thumb-ring { position: relative; width: 54px; height: 54px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(123,92,255,0.55); background: #1B2338; }
  .play-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .play { width: 40px; height: 40px; border-radius: 50%; background: #7B5CFF; color: #F2F4F8; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(11,15,26,0.45); }

  /* title = the match: day (big) + time · pitch (small) */
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .day { font: 800 17px/1.3 'Cairo', sans-serif; }
  .meta { display: flex; align-items: center; gap: 6px; color: #8A93A6; font: 500 14px 'Tajawal', sans-serif; }
  .time { font: 600 16px 'Rajdhani', sans-serif; color: #F2F4F8; }
  .pitch { font: 600 15px 'Rajdhani', sans-serif; }

  /* bottom bar: portfolio switch (fills the row) | divider | delete */
  .clip-bar { display: flex; align-items: center; border-top: 1px solid #232C42; }
  .share { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 0 14px; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: start; font: inherit; }
  .share-text { display: flex; flex-direction: column; gap: 2px; }
  .share-label { font: 700 15px 'Tajawal', sans-serif; color: #F2F4F8; }
  .state { font: 500 13px 'Tajawal', sans-serif; color: #8A93A6; }
  .state.on { color: #2FD8C4; }

  /* switch 50x30: off = line track, muted knob at the start side; on = turf track, void knob at the end side */
  .switch { flex: none; width: 50px; height: 30px; box-sizing: border-box; border-radius: 999px; background: #232C42; padding: 3px;
            display: flex; justify-content: flex-start; transition: background .2s; }
  .switch .knob { width: 24px; height: 24px; border-radius: 50%; background: #8A93A6; transition: background .2s; }
  .switch.on { background: #2FD8C4; justify-content: flex-end; }
  .switch.on .knob { background: #0B0F1A; }

  .divider { width: 1px; height: 28px; background: #232C42; }
  .delete { flex: none; width: 56px; min-height: 56px; border: 0; background: transparent; color: #8A93A6;
            display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
