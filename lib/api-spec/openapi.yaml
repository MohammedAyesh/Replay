openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SoccerWatch API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: fields
    description: Soccer fields
  - name: recordings
    description: Field recordings
  - name: clips
    description: Highlight clips
  - name: savedClips
    description: User saved clips
  - name: likes
    description: Clip likes
  - name: account
    description: User account
  - name: ads
    description: Ad serving
  - name: banners
    description: Banner content from storage
  - name: admin
    description: Admin ad management
  - name: users
    description: User profiles and follows
  - name: academies
    description: Soccer academies
  - name: claimMatch
    description: Claim Your Match tracking and player identity

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/guest:
    post:
      operationId: loginAsGuest
      tags: [auth]
      summary: Browse as guest
      responses:
        "200":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /account/consents:
    patch:
      operationId: updateConsents
      tags: [account]
      summary: Save recording and social media consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaConsentInput"
      responses:
        "200":
          description: Updated consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Recording consent is required
        "401":
          description: Unauthenticated

  /fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List all fields
      responses:
        "200":
          description: List of fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Field"

  /fields/{id}:
    get:
      operationId: getField
      tags: [fields]
      summary: Get field by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "404":
          description: Not found

  /bunny/collections:
    get:
      operationId: getBunnyCollections
      tags: [fields]
      summary: List all Bunny Stream collections (one per field)
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyCollection"

  /bunny/collections/{guid}/videos:
    get:
      operationId: getBunnyCollectionVideos
      tags: [fields]
      summary: Get videos in a Bunny Stream collection
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of videos in the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyVideo"

  /fields/{id}/videos:
    get:
      operationId: getFieldVideos
      tags: [fields]
      summary: Get Bunny Stream videos for a field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of Bunny Stream videos for this field
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyVideo"

  /fields/{id}/recordings:
    get:
      operationId: getFieldRecordings
      tags: [recordings]
      summary: Get recordings for a field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /recordings/{id}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: Get a recording by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          description: Not found

  /recordings/{id}/claim-match:
    get:
      operationId: getClaimMatch
      tags: [claimMatch]
      summary: Get a recording tracking bundle and the current player's claim progress
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claim Your Match state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimMatchResponse"
        "401":
          description: Authenticated account required
        "404":
          description: Recording or tracking bundle not found

    patch:
      operationId: updateClaimMatchProgress
      tags: [claimMatch]
      summary: Save claim progress for the current player
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProgressInput"
      responses:
        "200":
          description: Updated claim progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimProgress"
        "401":
          description: Authenticated account required
        "404":
          description: Recording or tracking bundle not found

  /claim-match/demo/reset:
    post:
      operationId: resetClaimMatchDemo
      tags: [claimMatch]
      summary: Reset the current player's Claim Demo progress
      security:
        - clerkSession: []
      responses:
        "200":
          description: Claim Demo reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimMatchDemoResetResponse"
        "401":
          description: Authenticated account required
        "404":
          description: No tracking bundle has been uploaded yet

  /claim-match/clips:
    get:
      operationId: listClaimMatchClips
      tags: [claimMatch]
      summary: List the current player's earned match moments
      security:
        - clerkSession: []
      responses:
        "200":
          description: Earned match moments grouped by recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimMatchClipsResponse"
        "401":
          description: Authenticated account required

  /recordings/{id}/claim-match/corrections:
    post:
      operationId: createClaimMatchCorrection
      tags: [claimMatch]
      summary: Record an identity correction, safely repeatable by client id
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCorrectionInput"
      responses:
        "200":
          description: Correction already recorded or recorded now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCorrection"
        "201":
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCorrection"
        "401":
          description: Authenticated account required
        "404":
          description: Recording or tracking bundle not found

  /recordings/{id}/claim-match/segments/{segmentIndex}:
    get:
      operationId: getClaimMatchSegment
      tags: [claimMatch]
      summary: Get one compressed tracking segment for the current player
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: segmentIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Tracking segment
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSegment"
        "401":
          description: Authenticated account required
        "404":
          description: Recording or tracking segment not found

  /claim-match/corrections/{correctionId}:
    delete:
      operationId: undoClaimMatchCorrection
      tags: [claimMatch]
      summary: Undo a previously synced correction
      security:
        - clerkSession: []
      parameters:
        - name: correctionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Correction marked undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCorrection"
        "401":
          description: Authenticated account required
        "403":
          description: Correction belongs to another user
        "404":
          description: Correction not found

  /admin/recordings/{id}/tracking-bundle:
    put:
      operationId: replaceTrackingBundle
      tags: [admin]
      summary: Upload or replace a recording tracking bundle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingBundle"
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: string
                  description: ZIP file containing manifest.json and the segment JSON files
      responses:
        "200":
          description: Tracking bundle stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingBundleSummary"
        "400":
          description: Invalid tracking bundle
        "403":
          description: Forbidden
        "404":
          description: Recording not found

  /academies:
    get:
      operationId: listAcademies
      tags: [academies]
      summary: List all academies
      responses:
        "200":
          description: List of academies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademySummary"

  /academies/{id}:
    get:
      operationId: getAcademy
      tags: [academies]
      summary: Get an academy by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Academy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "404":
          description: Not found

  /academies/{id}/recordings:
    get:
      operationId: getAcademyRecordings
      tags: [academies]
      summary: Get recordings linked to an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recordings for this academy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /admin/academies:
    get:
      operationId: listAdminAcademies
      tags: [admin]
      summary: List all academies (admin)
      responses:
        "200":
          description: List of academies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademySummary"
    post:
      operationId: createAcademy
      tags: [admin]
      summary: Create a new academy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademyInput"
      responses:
        "201":
          description: Academy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "403":
          description: Forbidden

  /admin/academies/{id}:
    patch:
      operationId: updateAcademy
      tags: [admin]
      summary: Update an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademyInput"
      responses:
        "200":
          description: Academy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAcademy
      tags: [admin]
      summary: Delete an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden

  /admin/academies/{id}/recordings:
    post:
      operationId: addAcademyRecording
      tags: [admin]
      summary: Link a recording to an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAcademyRecordingInput"
      responses:
        "204":
          description: Added
        "403":
          description: Forbidden

  /admin/academies/{id}/recordings/{recordingId}:
    delete:
      operationId: removeAcademyRecording
      tags: [admin]
      summary: Unlink a recording from an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: recordingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden

  /user-clips:
    post:
      operationId: createUserClip
      tags: [clips]
      summary: Create a user clip from a full match video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserClipInput"
      responses:
        "201":
          description: Clip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated
    get:
      operationId: listUserClips
      tags: [clips]
      summary: List clips created by the current user
      responses:
        "200":
          description: User's created clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated

  /user-clips/{id}:
    delete:
      operationId: deleteUserClip
      tags: [clips]
      summary: Delete a user-created clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip deleted
        "401":
          description: Unauthenticated
        "403":
          description: Not your clip
        "404":
          description: Not found
    patch:
      operationId: updateUserClip
      tags: [clips]
      summary: Update a user-created clip (visibility or title)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserClipInput"
      responses:
        "200":
          description: Clip updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated
        "403":
          description: Not your clip
        "404":
          description: Not found

  /user-clips/{id}/like:
    post:
      operationId: toggleUserClipLike
      tags: [likes]
      summary: Toggle like on a user clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found

  /user-clips/{id}/view:
    post:
      operationId: recordView
      tags: [clips]
      summary: Record a view for a user clip (engagement tracking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResult"
        "404":
          description: Not found

  /user-clips/{id}/share:
    post:
      operationId: recordShare
      tags: [clips]
      summary: Record a share for a user clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResult"
        "404":
          description: Not found

  /feed:
    get:
      operationId: getFeed
      tags: [clips]
      summary: Get the shared user clip feed, visibility-filtered, ordered by engagement score
      responses:
        "200":
          description: Feed of user clips with creator info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedClip"

  /clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: Get ranked highlights feed for current week
      responses:
        "200":
          description: Ranked clips feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clip"

  /clips/{id}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a single clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Not found

  /clips/{id}/like:
    post:
      operationId: toggleLike
      tags: [likes]
      summary: Toggle like on a clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /saved-clips:
    get:
      operationId: listSavedClips
      tags: [savedClips]
      summary: Get user's saved clips
      responses:
        "200":
          description: Saved clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clip"

  /saved-clips/{clipId}:
    put:
      operationId: saveClip
      tags: [savedClips]
      summary: Save a clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip saved
    delete:
      operationId: unsaveClip
      tags: [savedClips]
      summary: Unsave a clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip unsaved

  /account/stats:
    get:
      operationId: getAccountStats
      tags: [account]
      summary: Get current user stats (saved clips count, likes given, fields visited)
      responses:
        "200":
          description: Account stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStats"

  /account/locale:
    patch:
      operationId: updateLocale
      tags: [account]
      summary: Persist the user's preferred locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleInput"
      responses:
        "200":
          description: Locale updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /account/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update user profile (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /ads/next:
    get:
      operationId: getNextAd
      tags: [ads]
      summary: Get next ad for current user (frequency-capped)
      responses:
        "200":
          description: Next ad to show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "204":
          description: No ad available

  /ads/{id}/impression:
    post:
      operationId: recordImpression
      tags: [ads]
      summary: Record an ad impression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpressionInput"
      responses:
        "200":
          description: Impression recorded

  /ads/{id}/click:
    post:
      operationId: recordClick
      tags: [ads]
      summary: Record an ad click
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Click recorded

  /users/{id}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a public player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found

  /banners:
    get:
      operationId: listBanners
      tags: [banners]
      summary: List all banners from Bunny storage
      responses:
        "200":
          description: Available banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"

  /admin/ads:
    get:
      operationId: listAdminAds
      tags: [admin]
      summary: List all ad campaigns (admin)
      responses:
        "200":
          description: All campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAdEntry"
    post:
      operationId: createAd
      tags: [admin]
      summary: Create a new ad campaign (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdEntry"

  /admin/ads/{id}:
    patch:
      operationId: updateAd
      tags: [admin]
      summary: Update ad status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAdInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdEntry"

  /admin/ads/{id}/stats:
    get:
      operationId: getAdStats
      tags: [admin]
      summary: Get stats for an ad campaign (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, isGuest, profileComplete, recordingConsent, socialMediaConsent, consentRequired]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        isGuest:
          type: boolean
        isAdmin:
          type: boolean
        phone:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        profileComplete:
          type: boolean
        preferredLocale:
          type: ["string", "null"]
        recordingConsent:
          type: boolean
        recordingConsentAt:
          type: ["string", "null"]
          format: date-time
        socialMediaConsent:
          type: boolean
        socialMediaConsentAt:
          type: ["string", "null"]
          format: date-time
        consentRequired:
          type: boolean

    MediaConsentInput:
      type: object
      required: [recordingConsent, socialMediaConsent]
      properties:
        recordingConsent:
          type: boolean
        socialMediaConsent:
          type: boolean

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Field:
      type: object
      required: [id, name, location, courts, clipCount, weight]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        courts:
          type: integer
        clipCount:
          type: integer
        weight:
          type: number
          description: Admin-controlled recommendation weight (higher = more prominent)
        thumbnailUrl:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        lastRecordedAt:
          type: ["string", "null"]

    BunnyCollection:
      type: object
      required: [guid, name, videoCount]
      properties:
        guid:
          type: string
        name:
          type: string
        videoCount:
          type: integer
        previewImageUrl:
          type: ["string", "null"]
        id:
          type: ["integer", "null"]
          description: >-
            The corresponding fields table row id, if this collection has been
            synced via /admin/fields/sync. Null for collections Bunny has that
            haven't been synced into a field yet.

    BunnyVideo:
      type: object
      required: [guid, title, thumbnailUrl, playbackUrl, embedUrl]
      properties:
        guid:
          type: string
        title:
          type: string
        thumbnailUrl:
          type: string
        playbackUrl:
          type: string
        embedUrl:
          type: string
        views:
          type: integer
        duration:
          type: number

    Recording:
      type: object
      required: [id, fieldId, court, date, timeSlot, duration]
      properties:
        id:
          type: integer
        fieldId:
          type: integer
        court:
          type: string
        date:
          type: string
        timeSlot:
          type: string
        duration:
          type: string
        score:
          type: ["string", "null"]
        videoUrl:
          type: string
        highlightMoment:
          type: ["string", "null"]
        fieldName:
          type: ["string", "null"]

    PublicProfile:
      type: object
      required: [id, name, followerCount, followingCount, clipCount, isFollowing]
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        followerCount:
          type: integer
        followingCount:
          type: integer
        clipCount:
          type: integer
        isFollowing:
          type: boolean

    FollowResult:
      type: object
      required: [following, followerCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer

    Clip:
      type: object
      required: [id, recordingId, rank, momentLabel, likeCount, startTime, endTime, cropPath]
      properties:
        id:
          type: integer
        recordingId:
          type: integer
        rank:
          type: integer
        momentLabel:
          type: string
        playerTags:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        startTime:
          type: number
        endTime:
          type: number
        cropPath:
          type: array
          items:
            $ref: "#/components/schemas/CropKeyframe"
        isLiked:
          type: boolean
        isSaved:
          type: boolean
        videoUrl:
          type: string
        bunnyPlaybackUrl:
          type: ["string", "null"]
        bunnyVideoId:
          type: ["string", "null"]
        fieldName:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        creatorId:
          type: ["integer", "null"]
        creatorName:
          type: ["string", "null"]
        creatorPosition:
          type: ["string", "null"]
        academyId:
          type: ["integer", "null"]
          description: >-
            Academy whose field this recording belongs to, if any (matched by
            fieldId — best-effort, not stored on the clip itself).
        introVideoUrl:
          type: ["string", "null"]
          description: Branding intro to play before this clip, if its academy has one set.

    CropKeyframe:
      type: object
      required: [t, x, y, w, h]
      properties:
        t:
          type: number
          description: Time position as fraction (0-1) of clip duration
        x:
          type: number
          description: Crop left edge as fraction of total video width
        y:
          type: number
        w:
          type: number
          description: Crop width as fraction of total video width
        h:
          type: number

    UserClip:
      type: object
      required: [id, userId, videoId, title, startTime, endTime, cropPath, visibility, likeCount, createdAt, aspectRatio]
      properties:
        id:
          type: integer
        userId:
          type: integer
        videoId:
          type: string
        title:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        cropPath:
          type: array
          items:
            $ref: "#/components/schemas/CropKeyframe"
        visibility:
          type: string
          enum: ["public", "followers", "private"]
        likeCount:
          type: integer
        aspectRatio:
          type: string
        thumbnailTime:
          type: ["number", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        playbackUrl:
          type: ["string", "null"]
        exportStatus:
          type: ["string", "null"]
        exportedUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        academyId:
          type: ["integer", "null"]
        introVideoUrl:
          type: ["string", "null"]
          description: Branding intro to play before this clip, if its academy has one set.

    SocialLikeUser:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: integer
        name:
          type: string

    FeedClip:
      type: object
      required: [id, userId, videoId, title, startTime, endTime, cropPath, likeCount, viewCount, shareCount, score, isLiked, visibility, createdAt, creatorId, creatorName, socialLikes, aspectRatio]
      properties:
        id:
          type: integer
        userId:
          type: integer
        videoId:
          type: string
        title:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        cropPath:
          type: array
          items:
            $ref: "#/components/schemas/CropKeyframe"
        likeCount:
          type: integer
        viewCount:
          type: integer
        shareCount:
          type: integer
        score:
          type: number
        isLiked:
          type: boolean
        visibility:
          type: string
          enum: ["public", "followers", "private"]
        aspectRatio:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        playbackUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        creatorId:
          type: integer
        creatorName:
          type: string
        creatorPosition:
          type: ["string", "null"]
        socialLikes:
          type: array
          items:
            $ref: "#/components/schemas/SocialLikeUser"

    CreateUserClipInput:
      type: object
      required: [videoId, title, startTime, endTime, cropPath]
      properties:
        videoId:
          type: string
        title:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        cropPath:
          type: array
          items:
            $ref: "#/components/schemas/CropKeyframe"
        visibility:
          type: string
          enum: ["public", "followers", "private"]
        aspectRatio:
          type: string
          enum: ["16:9", "9:16"]
        academyId:
          type: ["integer", "null"]
          description: Academy context this clip was created under (from the page the user was viewing), if any.

    UpdateUserClipInput:
      type: object
      properties:
        title:
          type: string
        visibility:
          type: string
          enum: ["public", "followers", "private"]
        thumbnailTime:
          type: ["number", "null"]

    LikeResult:
      type: object
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer

    ViewInput:
      type: object
      required: [secondsWatched]
      properties:
        secondsWatched:
          type: number
          minimum: 0

    EngagementResult:
      type: object
      required: [ok, viewCount, shareCount, likeCount, score]
      properties:
        ok:
          type: boolean
        viewCount:
          type: integer
        shareCount:
          type: integer
        likeCount:
          type: integer
        score:
          type: number

    ProfileInput:
      type: object
      required: [name, phone, position, age, gender]
      properties:
        name:
          type: string
        phone:
          type: string
        position:
          type: string
          enum: [goalkeeper, defender, midfielder, forward]
        age:
          type: integer
          minimum: 10
          maximum: 99
        gender:
          type: string
          enum: [male, female, prefer_not_to_say]

    AccountStats:
      type: object
      required: [savedClips, likesGiven, fieldsVisited]
      properties:
        savedClips:
          type: integer
        likesGiven:
          type: integer
        fieldsVisited:
          type: integer

    LocaleInput:
      type: object
      required: [locale]
      properties:
        locale:
          type: string

    Ad:
      type: object
      required: [id, title, creativeUrl, clickUrl, durationSeconds, targetType]
      properties:
        id:
          type: integer
        title:
          type: string
        creativeUrl:
          type: string
        clickUrl:
          type: string
        durationSeconds:
          type: integer
        targetType:
          type: string

    AcademySummary:
      type: object
      required: [id, name, fieldId, fieldName, fieldLocation, daysOfWeek, recordingCount]
      properties:
        id:
          type: integer
        name:
          type: string
        fieldId:
          type: integer
        fieldName:
          type: string
        fieldLocation:
          type: string
        daysOfWeek:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        introVideoUrl:
          type: ["string", "null"]
          description: Branding intro clip prepended to this academy's clip exports and playback.
        recordingCount:
          type: integer

    CreateAcademyInput:
      type: object
      required: [name, fieldId, daysOfWeek]
      properties:
        name:
          type: string
        fieldId:
          type: integer
        daysOfWeek:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]

    UpdateAcademyInput:
      type: object
      properties:
        name:
          type: string
        fieldId:
          type: integer
        daysOfWeek:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]

    AddAcademyRecordingInput:
      type: object
      required: [recordingId]
      properties:
        recordingId:
          type: integer

    Banner:
      type: object
      required: [id, title, imageUrl]
      properties:
        id:
          type: string
        upperSubtext:
          type: string
        title:
          type: string
        lowerSubtext:
          type: string
        imageUrl:
          type: string
        hyperlink:
          type: ["string", "null"]

    ImpressionInput:
      type: object
      required: [clipId, completed]
      properties:
        clipId:
          type: integer
        completed:
          type: boolean
        skippedAtSecond:
          type: ["integer", "null"]

    AdminAdEntry:
      type: object
      required: [id, title, creativeUrl, clickUrl, durationSeconds, targetType, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        creativeUrl:
          type: string
        clickUrl:
          type: string
        durationSeconds:
          type: integer
        targetType:
          type: string
        targetFieldId:
          type: ["integer", "null"]
        startsAt:
          type: ["string", "null"]
        endsAt:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    CreateAdInput:
      type: object
      required: [title, creativeUrl, clickUrl, durationSeconds]
      properties:
        title:
          type: string
        creativeUrl:
          type: string
        clickUrl:
          type: string
        durationSeconds:
          type: integer
        targetType:
          type: string
        targetFieldId:
          type: ["integer", "null"]
        startsAt:
          type: ["string", "null"]
        endsAt:
          type: ["string", "null"]
        status:
          type: string

    PatchAdInput:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        creativeUrl:
          type: string
        clickUrl:
          type: string
        durationSeconds:
          type: integer

    AdStats:
      type: object
      required: [impressions, clicks, completions, skipRate, completionRate]
      properties:
        impressions:
          type: integer
        clicks:
          type: integer
        completions:
          type: integer
        skipRate:
          type: number
        completionRate:
          type: number

    TrackingBox:
      type: object
      required: [frame, x, y, w, h]
      properties:
        frame:
          type: integer
          minimum: 0
        x:
          type: number
        y:
          type: number
        w:
          type: number
          minimum: 0
        h:
          type: number
          minimum: 0

    TrackingTrack:
      type: object
      required: [id, startFrame, endFrame, boxes]
      properties:
        id:
          type: string
        label:
          type: ["string", "null"]
        startFrame:
          type: integer
          minimum: 0
        endFrame:
          type: integer
          minimum: 0
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/TrackingBox"

    TrackingCrossing:
      type: object
      required: [frame, trackId, otherTrackId]
      properties:
        frame:
          type: integer
          minimum: 0
        trackId:
          type: string
        otherTrackId:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    InPlaySpan:
      type: object
      required: [start, end]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0

    TrackingEvent:
      type: object
      required: [type, time]
      properties:
        type:
          type: string
        time:
          type: number
          minimum: 0
        label:
          type: ["string", "null"]
        clipId:
          type: ["string", "null"]

    TrackingSegment:
      type: object
      required: [version, segmentIndex, name, startFrame, endFrame, startSeconds, endSeconds, tracks, crossings, inPlaySpans, events]
      properties:
        version:
          type: integer
          minimum: 1
        segmentIndex:
          type: integer
          minimum: 0
        name:
          type: string
        startFrame:
          type: integer
          minimum: 0
        endFrame:
          type: integer
          minimum: 0
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          minimum: 0
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackingTrack"
        crossings:
          type: array
          items:
            $ref: "#/components/schemas/TrackingCrossing"
        inPlaySpans:
          type: array
          items:
            $ref: "#/components/schemas/InPlaySpan"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"

    TrackingSegmentManifest:
      type: object
      required: [index, name, startFrame, endFrame, startSeconds, endSeconds, objectPath]
      properties:
        index:
          type: integer
          minimum: 0
        name:
          type: string
        startFrame:
          type: integer
          minimum: 0
        endFrame:
          type: integer
          minimum: 0
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          minimum: 0
        objectPath:
          type: string
        spritesPath:
          type: string
          description: Object path of the crop strips for the identity board, when the bundle carried them.

    TrackingIdentityPart:
      type: object
      required: [trackId, fromFrame, toFrame]
      properties:
        trackId:
          type: string
        fromFrame:
          type: integer
          minimum: 0
        toFrame:
          type: integer
          minimum: 0

    TrackingIdentity:
      type: object
      required: [id, parts]
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        parts:
          type: array
          items:
            $ref: "#/components/schemas/TrackingIdentityPart"

    TrackingPitchModelGridPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          description: Pitch position in metres on the horizontal axis.
        y:
          type: number
          description: Pitch position in metres on the vertical axis.

    TrackingPitchModel:
      type: object
      required: [pitchWidthMetres, pitchHeightMetres, grid]
      properties:
        pitchWidthMetres:
          type: number
          exclusiveMinimum: 0
          description: Real pitch width represented by the model, in metres.
        pitchHeightMetres:
          type: number
          exclusiveMinimum: 0
          description: Real pitch height represented by the model, in metres.
        grid:
          type: array
          minItems: 2
          description: >
            Rectangular row-major calibration grid. Rows map from image top to
            bottom and columns map from image left to right. Values are pitch
            coordinates in metres and are bilinearly interpolated.
          items:
            type: array
            minItems: 2
            items:
              $ref: "#/components/schemas/TrackingPitchModelGridPoint"

    TrackingManifest:
      type: object
      required: [version, label, width, height, frameRate, frameCount, duration, matchOffset, segmentCount, segments]
      properties:
        version:
          type: integer
          minimum: 1
        label:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        frameRate:
          type: number
          exclusiveMinimum: 0
        frameCount:
          type: integer
          minimum: 1
        duration:
          type: number
          exclusiveMinimum: 0
        matchOffset:
          type: number
          description: >-
            Display only. Added to tracking time to show a clock that matches the
            wider match, e.g. an hour that starts at minute 40. Must never be used
            to seek.
        videoStartSeconds:
          type: number
          minimum: 0
          description: >-
            Where tracking frame 0 sits inside the video file, in seconds. The
            recording can be longer than the tracked window - the 2026-08-24
            recording is two hours and the tracked hour starts 18 minutes in, so
            this is 1080. Optional for bundles uploaded before this field existed;
            the server fills 0 and the boxes will be wrong until it is set.
        segmentCount:
          type: integer
          minimum: 1
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TrackingSegmentManifest"
        pitchModel:
          $ref: "#/components/schemas/TrackingPitchModel"
          description: Optional camera-to-pitch calibration for distance metrics.
        identities:
          type: array
          description: The identity board's result - pieces of tracks that are one person. Optional.
          items:
            $ref: "#/components/schemas/TrackingIdentity"
        provenance:
          type: object
          additionalProperties: true
          description: How the tracking bundle was produced.

    TrackingBundle:
      type: object
      description: Legacy single-file upload accepted during migration. New uploads should be ZIP bundles.
      required: [version, label, width, height, frameRate, frameCount, duration, matchOffset, tracks, crossings, inPlaySpans, events]
      properties:
        version:
          type: integer
          minimum: 1
        label:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        frameRate:
          type: number
          exclusiveMinimum: 0
        frameCount:
          type: integer
          minimum: 1
        duration:
          type: number
          exclusiveMinimum: 0
        matchOffset:
          type: number
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackingTrack"
        crossings:
          type: array
          items:
            $ref: "#/components/schemas/TrackingCrossing"
        inPlaySpans:
          type: array
          items:
            $ref: "#/components/schemas/InPlaySpan"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"

    TrackingBundleSummary:
      type: object
      required: [recordingId, label, duration, segmentCount, frameCoverage, trackCount, crossingCount, uploadedAt]
      properties:
        recordingId:
          type: integer
        label:
          type: string
        duration:
          type: number
        trackCount:
          type: integer
        crossingCount:
          type: integer
        segmentCount:
          type: integer
        frameCoverage:
          type: string
        segmentRanges:
          type: array
          items:
            $ref: "#/components/schemas/TrackingSegmentManifest"
        uploadedAt:
          type: string

    ClaimEarnedClip:
      type: object
      required: [id, title, momentSeconds, kind, status]
      properties:
        id:
          type: string
        title:
          type: string
        momentSeconds:
          type: number
        kind:
          type: string
        status:
          type: string
        userClipId:
          type: integer
          description: The user clip row backing this earned moment, when materialized.

    ClaimCorrection:
      type: object
      required: [id, clientId, recordingId, momentSeconds, chosenTrackId, answerMethod, questionCount, undone, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: string
        recordingId:
          type: integer
        momentSeconds:
          type: number
        rejectedTrackId:
          type: ["string", "null"]
        chosenTrackId:
          type: string
        answerMethod:
          type: string
        questionCount:
          type: integer
        undone:
          type: boolean
        createdAt:
          type: string

    ClaimPlayerStats:
      type: object
      required: [confirmedSeconds, minutesPlayed, coveragePercent, answeredMoments, acceptedMoments, trackedSegments, totalSegments, matchedEvents, heatmap, distanceMetres]
      properties:
        confirmedSeconds:
          type: number
          minimum: 0
          description: Union of the player's accepted tracking intervals, in seconds.
        minutesPlayed:
          type: number
          minimum: 0
          description: Confirmed player presence in minutes.
        coveragePercent:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage of the tracked match covered by accepted player intervals.
        answeredMoments:
          type: integer
          minimum: 0
          description: Identity checkpoint moments answered by the player.
        acceptedMoments:
          type: integer
          minimum: 0
          description: Identity checkpoint moments accepted as the player.
        trackedSegments:
          type: integer
          minimum: 0
          description: Tracking segments containing an accepted interval for the player.
        totalSegments:
          type: integer
          minimum: 0
          description: Total tracking segments in the uploaded match bundle.
        matchedEvents:
          type: integer
          minimum: 0
          description: Match events that occurred during an accepted player interval.
        heatmap:
          type: object
          required: [coordinateSpace, cells]
          properties:
            coordinateSpace:
              type: string
              enum: [pitch, camera]
              description: Pitch-normalized coordinates when calibrated, otherwise image coordinates.
            cells:
              type: array
              items:
                type: object
                required: [x, y, weight]
                properties:
                  x:
                    type: number
                    minimum: 0
                    maximum: 1
                  y:
                    type: number
                    minimum: 0
                    maximum: 1
                  weight:
                    type: number
                    minimum: 0
        distanceMetres:
          type: ["number", "null"]
          minimum: 0
          description: Smoothed camera-derived distance in metres, or null without a pitch model.

    ClaimProgress:
      type: object
      required: [recordingId, stage, confirmedFromSeconds, currentPositionSeconds, claimedPercent, coverageSeconds, coveragePercent, answeredAnchorCount, acceptedAnchorCount, unresolvedMoments, clipsUnlocked, correctionCount, completed, earnedClips, completionReason, playerStats, updatedAt]
      properties:
        recordingId:
          type: integer
        currentTrackId:
          type: ["string", "null"]
        stage:
          type: string
        confirmedFromSeconds:
          type: number
        currentPositionSeconds:
          type: number
        claimedPercent:
          type: number
          description: >-
            Backwards-compatible name for coveragePercent. This is derived from
            accepted attributed person-seconds on the server, never from UI stage.
        coverageSeconds:
          type: number
          minimum: 0
          description: Union of the accepted track spans, in tracking seconds.
        coveragePercent:
          type: number
          minimum: 0
          maximum: 100
          description: coverageSeconds divided by the tracked match duration.
        answeredAnchorCount:
          type: integer
          minimum: 0
        acceptedAnchorCount:
          type: integer
          minimum: 0
        unresolvedMoments:
          type: array
          description: Anchor moments answered as not me or skipped.
          items:
            type: number
            minimum: 0
        clipsUnlocked:
          type: integer
        correctionCount:
          type: integer
        completed:
          type: boolean
        completionReason:
          type: string
        earnedClips:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEarnedClip"
        playerStats:
          $ref: "#/components/schemas/ClaimPlayerStats"
        updatedAt:
          type: string

    ClaimProgressInput:
      type: object
      required: [stage, confirmedFromSeconds, currentPositionSeconds, claimedPercent, clipsUnlocked, completed]
      properties:
        currentTrackId:
          type: ["string", "null"]
        stage:
          type: string
        confirmedFromSeconds:
          type: number
          minimum: 0
        currentPositionSeconds:
          type: number
          minimum: 0
        claimedPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Accepted for backwards compatibility; the server recalculates it.
        clipsUnlocked:
          type: integer
          minimum: 0
        completed:
          type: boolean
          description: Accepted for backwards compatibility; the server recalculates it.
        earnedClips:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEarnedClip"

    ClaimCorrectionInput:
      type: object
      required: [clientId, momentSeconds, chosenTrackId, answerMethod, questionCount]
      properties:
        clientId:
          type: string
          minLength: 1
        momentSeconds:
          type: number
          minimum: 0
        rejectedTrackId:
          type: ["string", "null"]
        chosenTrackId:
          type: string
        answerMethod:
          type: string
        questionCount:
          type: integer
          minimum: 0

    ClaimMatchResponse:
      type: object
      required: [recording, manifest, progress, corrections]
      properties:
        recording:
          $ref: "#/components/schemas/Recording"
        manifest:
          $ref: "#/components/schemas/TrackingManifest"
        progress:
          $ref: "#/components/schemas/ClaimProgress"
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/ClaimCorrection"

    ClaimMatchDemoResetResponse:
      type: object
      required: [recordingId, reset]
      properties:
        recordingId:
          type: integer
        reset:
          type: boolean

    ClaimMatchClipGroup:
      type: object
      required: [recordingId, recordingLabel, fieldName, date, clips]
      properties:
        recordingId:
          type: integer
        recordingLabel:
          type: string
          description: Human-readable match label.
        fieldName:
          type: string
        date:
          type: string
        clips:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEarnedClip"

    ClaimMatchClipsResponse:
      type: array
      items:
        $ref: "#/components/schemas/ClaimMatchClipGroup"

  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
