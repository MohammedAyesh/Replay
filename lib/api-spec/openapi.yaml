openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SoccerWatch API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: fields
    description: Soccer fields
  - name: recordings
    description: Field recordings
  - name: clips
    description: Highlight clips
  - name: savedClips
    description: User saved clips
  - name: likes
    description: Clip likes
  - name: account
    description: User account
  - name: ads
    description: Ad serving
  - name: banners
    description: Banner content from storage
  - name: admin
    description: Admin ad management
  - name: users
    description: User profiles and follows
  - name: academies
    description: Soccer academies

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/guest:
    post:
      operationId: loginAsGuest
      tags: [auth]
      summary: Browse as guest
      responses:
        "200":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List all fields
      responses:
        "200":
          description: List of fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Field"

  /fields/{id}:
    get:
      operationId: getField
      tags: [fields]
      summary: Get field by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "404":
          description: Not found

  /bunny/collections:
    get:
      operationId: getBunnyCollections
      tags: [fields]
      summary: List all Bunny Stream collections (one per field)
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyCollection"

  /bunny/collections/{guid}/videos:
    get:
      operationId: getBunnyCollectionVideos
      tags: [fields]
      summary: Get videos in a Bunny Stream collection
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of videos in the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyVideo"

  /fields/{id}/videos:
    get:
      operationId: getFieldVideos
      tags: [fields]
      summary: Get Bunny Stream videos for a field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of Bunny Stream videos for this field
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BunnyVideo"

  /fields/{id}/recordings:
    get:
      operationId: getFieldRecordings
      tags: [recordings]
      summary: Get recordings for a field
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /recordings/{id}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: Get a recording by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          description: Not found

  /academies:
    get:
      operationId: listAcademies
      tags: [academies]
      summary: List all academies
      responses:
        "200":
          description: List of academies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademySummary"

  /academies/{id}:
    get:
      operationId: getAcademy
      tags: [academies]
      summary: Get an academy by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Academy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "404":
          description: Not found

  /academies/{id}/recordings:
    get:
      operationId: getAcademyRecordings
      tags: [academies]
      summary: Get recordings linked to an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recordings for this academy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /admin/academies:
    get:
      operationId: listAdminAcademies
      tags: [admin]
      summary: List all academies (admin)
      responses:
        "200":
          description: List of academies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademySummary"
    post:
      operationId: createAcademy
      tags: [admin]
      summary: Create a new academy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademyInput"
      responses:
        "201":
          description: Academy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "403":
          description: Forbidden

  /admin/academies/{id}:
    patch:
      operationId: updateAcademy
      tags: [admin]
      summary: Update an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademyInput"
      responses:
        "200":
          description: Academy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademySummary"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAcademy
      tags: [admin]
      summary: Delete an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden

  /admin/academies/{id}/recordings:
    post:
      operationId: addAcademyRecording
      tags: [admin]
      summary: Link a recording to an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAcademyRecordingInput"
      responses:
        "204":
          description: Added
        "403":
          description: Forbidden

  /admin/academies/{id}/recordings/{recordingId}:
    delete:
      operationId: removeAcademyRecording
      tags: [admin]
      summary: Unlink a recording from an academy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: recordingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden

  /user-clips:
    post:
      operationId: createUserClip
      tags: [clips]
      summary: Create a user clip from a full match video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserClipInput"
      responses:
        "201":
          description: Clip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated
    get:
      operationId: listUserClips
      tags: [clips]
      summary: List clips created by the current user
      responses:
        "200":
          description: User's created clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated

  /user-clips/{id}:
    delete:
      operationId: deleteUserClip
      tags: [clips]
      summary: Delete a user-created clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip deleted
        "401":
          description: Unauthenticated
        "403":
          description: Not your clip
        "404":
          description: Not found
    patch:
      operationId: updateUserClip
      tags: [clips]
      summary: Update a user-created clip (visibility or title)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserClipInput"
      responses:
        "200":
          description: Clip updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserClip"
        "401":
          description: Unauthenticated
        "403":
          description: Not your clip
        "404":
          description: Not found

  /user-clips/{id}/like:
    post:
      operationId: toggleUserClipLike
      tags: [likes]
      summary: Toggle like on a user clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found

  /user-clips/{id}/view:
    post:
      operationId: recordView
      tags: [clips]
      summary: Record a view for a user clip (engagement tracking)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResult"
        "404":
          description: Not found

  /user-clips/{id}/share:
    post:
      operationId: recordShare
      tags: [clips]
      summary: Record a share for a user clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResult"
        "404":
          description: Not found

  /feed:
    get:
      operationId: getFeed
      tags: [clips]
      summary: Get the shared user clip feed, visibility-filtered, ordered by engagement score
      responses:
        "200":
          description: Feed of user clips with creator info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedClip"

  /clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: Get ranked highlights feed for current week
      responses:
        "200":
          description: Ranked clips feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clip"

  /clips/{id}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a single clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Not found

  /clips/{id}/like:
    post:
      operationId: toggleLike
      tags: [likes]
      summary: Toggle like on a clip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /saved-clips:
    get:
      operationId: listSavedClips
      tags: [savedClips]
      summary: Get user's saved clips
      responses:
        "200":
          description: Saved clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clip"

  /saved-clips/{clipId}:
    put:
      operationId: saveClip
      tags: [savedClips]
      summary: Save a clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip saved
    delete:
      operationId: unsaveClip
      tags: [savedClips]
      summary: Unsave a clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clip unsaved

  /account/stats:
    get:
      operationId: getAccountStats
      tags: [account]
      summary: Get current user stats (saved clips count, likes given, fields visited)
      responses:
        "200":
          description: Account stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStats"

  /account/locale:
    patch:
      operationId: updateLocale
      tags: [account]
      summary: Persist the user's preferred locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleInput"
      responses:
        "200":
          description: Locale updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /account/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update user profile (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /ads/next:
    get:
      operationId: getNextAd
      tags: [ads]
      summary: Get next ad for current user (frequency-capped)
      responses:
        "200":
          description: Next ad to show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "204":
          description: No ad available

  /ads/{id}/impression:
    post:
      operationId: recordImpression
      tags: [ads]
      summary: Record an ad impression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpressionInput"
      responses:
        "200":
          description: Impression recorded

  /ads/{id}/click:
    post:
      operationId: recordClick
      tags: [ads]
      summary: Record an ad click
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Click recorded

  /users/{id}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a public player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          description: Unauthenticated
        "404":
          description: Not found

  /banners:
    get:
      operationId: listBanners
      tags: [banners]
      summary: List all banners from Bunny storage
      responses:
        "200":
          description: Available banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"

  /admin/ads:
    get:
      operationId: listAdminAds
      tags: [admin]
      summary: List all ad campaigns (admin)
      responses:
        "200":
          description: All campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAdEntry"
    post:
      operationId: createAd
      tags: [admin]
      summary: Create a new ad campaign (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdEntry"

  /admin/ads/{id}:
    patch:
      operationId: updateAd
      tags: [admin]
      summary: Update ad status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAdInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdEntry"

  /admin/ads/{id}/stats:
    get:
      operationId: getAdStats
      tags: [admin]
      summary: Get stats for an ad campaign (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, isGuest, profileComplete]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        isGuest:
          type: boolean
        isAdmin:
          type: boolean
        phone:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        profileComplete:
          type: boolean
        preferredLocale:
          type: ["string", "null"]

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Field:
      type: object
      required: [id, name, location, courts, clipCount, weight]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        courts:
          type: integer
        clipCount:
          type: integer
        weight:
          type: number
          description: Admin-controlled recommendation weight (higher = more prominent)
        thumbnailUrl:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        lastRecordedAt:
          type: ["string", "null"]

    BunnyCollection:
      type: object
      required: [guid, name, videoCount]
      properties:
        guid:
          type: string
        name:
          type: string
        videoCount:
          type: integer
        previewImageUrl:
          type: ["string", "null"]

    BunnyVideo:
      type: object
      required: [guid, title, thumbnailUrl, playbackUrl, embedUrl]
      properties:
        guid:
          type: string
        title:
          type: string
        thumbnailUrl:
          type: string
        playbackUrl:
          type: string
        embedUrl:
          type: string
        views:
          type: integer
        duration:
          type: number

    Recording:
      type: object
      required: [id, fieldId, court, date, timeSlot, duration]
      properties:
        id:
          type: integer
        fieldId:
          type: integer
        court:
          type: string
        date:
          type: string
        timeSlot:
          type: string
        duration:
          type: string
        score:
          type: ["string", "null"]
        videoUrl:
          type: string
        highlightMoment:
          type: ["string", "null"]
        fieldName:
          type: ["string", "null"]

    PublicProfile:
      type: object
      required: [id, name, followerCount, followingCount, clipCount, isFollowing]
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        followerCount:
          type: integer
        followingCount:
          type: integer
        clipCount:
          type: integer
        isFollowing:
          type: boolean

    FollowResult:
      type: object
      required: [following, followerCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer

    Clip:
      type: object
      required: [id, recordingId, rank, momentLabel, likeCount, startTime, endTime, cropPath]
      properties:
        id:
          type: integer
        recordingId:
          type: integer
        rank:
          type: integer
        momentLabel:
          type: string
        playerTags:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        startTime:
          type: number
        endTime:
          type: number
        cropPath:
          type: array
          items:
            $ref: "#/components/schemas/CropKeyframe"
        isLiked:
          type: boolean
        isSaved:
          type: boolean
        videoUrl:
          type: string
        bunnyPlaybackUrl:
          type: ["string", "null"]
        bunnyVideoId:
          type: ["string", "null"]
        fieldName:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        creatorId:
          type: ["integer", "null"]
        creatorName:
          type: ["string", "null"]
        creatorPosition:
          type: ["string", "null"]

    CropKeyframe:
      type: object
      required: [t, x, y, w, h]
