<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0B0F1A;
        color: #F3F6FA;
      }

      #root {
        min-height: 100vh;
      }

      #replay-preload {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0B0F1A;
      }

      #replay-preload svg {
        width: 48px;
        height: 43px;
        overflow: visible;
      }

      #replay-preload .replay-facet {
        opacity: 0.25;
        transform-box: fill-box;
        transform-origin: center;
        animation: replay-facet-breathe 1.8s ease-in-out infinite;
      }

      #replay-preload .replay-facet:nth-child(1) { animation-delay: -1.35s; }
      #replay-preload .replay-facet:nth-child(2) { animation-delay: -1.08s; }
      #replay-preload .replay-facet:nth-child(3) { animation-delay: -0.81s; }
      #replay-preload .replay-facet:nth-child(4) { animation-delay: -0.54s; }
      #replay-preload .replay-facet:nth-child(5) { animation-delay: -0.27s; }
      #replay-preload .replay-facet:nth-child(6) { animation-delay: 0s; }
      #replay-preload .replay-facet:nth-child(7) { animation-delay: -1.62s; }

      @keyframes replay-facet-breathe {
        0%, 100% {
          opacity: 0.25;
          transform: translateY(1px) scale(0.96);
        }
        35% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        70% {
          opacity: 0.4;
          transform: translateY(-1px) scale(0.98);
        }
      }
    </style>
    <title>Replay</title>
    <meta name="description" content="Replay — browse and save your best soccer moments." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Replay" />
    <meta property="og:description" content="Replay — browse and save your best soccer moments." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Replay" />
    <meta name="twitter:description" content="Replay — browse and save your best soccer moments." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"></noscript>
  </head>
  <body>
    <div id="root">
      <div id="replay-preload" role="status" aria-label="Loading Replay">
        <svg viewBox="-5 0 225 200" aria-hidden="true">
          <defs>
            <clipPath id="replayPreloadClip">
              <circle cx="95" cy="96" r="88" />
            </clipPath>
          </defs>
          <g clip-path="url(#replayPreloadClip)">
            <polygon class="replay-facet" points="95,60 126.2,78 126.2,114 95,132 63.8,114 63.8,78" fill="#22C7B5"/>
            <polygon class="replay-facet" points="126.2,6 157.4,24 157.4,60 126.2,78 95,60 95,24" fill="#BFFF5C"/>
            <polygon class="replay-facet" points="63.8,6 95,24 95,60 63.8,78 32.6,60 32.6,24" fill="#3FE0C9"/>
            <polygon class="replay-facet" points="157.4,60 188.6,78 188.6,114 157.4,132 126.2,114 126.2,78" fill="#1FA79B"/>
            <polygon class="replay-facet" points="32.6,60 63.8,78 63.8,114 32.6,132 1.4,114 1.4,78" fill="#186E7E"/>
            <polygon class="replay-facet" points="126.2,114 157.4,132 157.4,168 126.2,186 95,168 95,132" fill="#1C8AA0"/>
            <polygon class="replay-facet" points="63.8,114 95,132 95,168 63.8,186 32.6,168 32.6,132" fill="#6C4FE0"/>
          </g>
          <polygon points="170,62 170,134 210,98" fill="#0B0F1A"/>
          <polygon points="172,68 172,128 206,98" fill="#D4FF4F"/>
          <circle cx="178" cy="46" r="7.5" fill="#0B0F1A"/>
          <circle cx="178" cy="46" r="5.5" fill="#FF5A3C"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
